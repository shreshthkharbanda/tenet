<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&family=JetBrains+Mono:wght@400;600;700&family=Overpass:wght@500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
{{CSS}}
</style>
<header class="bar">
  <div class="bar-in">
    <a class="brand" href="#"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="5" cy="17" r="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17" cy="5" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7.5 15 C11 11 11 11 14.5 7" stroke="var(--l2)" stroke-width="3" fill="none" stroke-linecap="round"/></svg><span id="brand-name">Specification</span></a>
    <nav class="nav" aria-label="Book">
      <a href="#">Overview</a><a href="#paths">Paths</a><a href="#chapters">Chapters</a><a href="#defects">Defects</a><a href="#glossary">Glossary</a>
    </nav>
    <div class="tools">
      <span class="lens" role="group" aria-label="Reading level"><button data-lens-set="everyone" aria-pressed="false" title="Plain words and pictures, no code">Everyone</button><button data-lens-set="engineer" aria-pressed="true" title="Adds how it works and the names it goes by">Engineer</button><button data-lens-set="expert" aria-pressed="false" title="Adds every claim and the code it cites">Expert</button></span>
      <button class="btn search-btn" id="t-search" aria-label="Search claims"><svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span class="t">Search claims</span><kbd>/</kbd></button>
      <button class="btn" id="t-font" aria-pressed="false" title="Switch between serif and sans body text">Aa serif</button>
      <button class="btn" id="t-theme" title="Theme: auto, light, dark">Auto</button>
      <button class="btn" id="t-motion" aria-pressed="true" title="Turn animation on or off">Motion on</button>
      <button class="btn menu-btn" id="t-menu" aria-expanded="false" aria-controls="drawer">Menu</button>
    </div>
  </div>
</header>
<nav class="drawer" id="drawer" hidden aria-label="Book"><a href="#">Overview</a><a href="#paths">Paths</a><a href="#chapters">Chapters</a><a href="#defects">Defects</a><a href="#glossary">Glossary</a>
  <span class="lens" role="group" aria-label="Reading level"><button data-lens-set="everyone" aria-pressed="false">Everyone</button><button data-lens-set="engineer" aria-pressed="true">Engineer</button><button data-lens-set="expert" aria-pressed="false">Expert</button></span>
  <div class="tools-m"><button class="btn" data-proxy="t-font">Serif / sans</button><button class="btn" data-proxy="t-theme">Theme</button><button class="btn" data-proxy="t-motion">Motion</button></div></nav>
<main id="view" class="view"><p class="loading">Loading the book…</p></main>
<footer class="foot" id="foot"></footer>
<div class="pop" id="pop" hidden role="dialog" aria-label="Claim"></div>
<div class="search" id="search" hidden role="dialog" aria-label="Search claims">
  <div class="search-box"><input id="q" type="search" placeholder="Search 2,800 claims: words, an ID like FAILURE-006, or a file" autocomplete="off" aria-label="Search claims"><div class="st" id="qst"></div><div class="results" id="results"></div></div>
</div>
